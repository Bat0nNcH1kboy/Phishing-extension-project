<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Проверка сайта</title>
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="shield">🛡️</div>
      <div>
        <h1>Антифишинг</h1>
        <p>Гибридная проверка URL: база 100k, ML, текстуры URL, эвристика и DNS</p>
      </div>
    </header>

    <section class="card">
      <label for="manualUrl">URL для проверки</label>
      <textarea id="manualUrl" rows="3" spellcheck="false" placeholder="URL активной вкладки появится здесь"></textarea>
      <div class="actions">
        <button id="checkCurrentBtn" type="button">Проверить вкладку</button>
        <button id="checkManualBtn" type="button" class="secondary">Проверить введённый URL</button>
      </div>
    </section>

    <section id="result" class="status unknown">Ожидание проверки...</section>
    <section id="details" class="details"></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
